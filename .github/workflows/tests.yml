name: Deploy Laravel Dev

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: dev-deploy
    cancel-in-progress: false

jobs:
    test:
        name: Test Laravel App
        runs-on: ubuntu-latest
        env:
            APP_ENV: testing
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: laravel
            DB_USERNAME: sail
            DB_PASSWORD: password
            MYSQL_ROOT_PASSWORD: password
            WWWGROUP: 1000
            WWWUSER: 1000

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP 8.5
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, bcmath, pdo, pdo_mysql, tokenizer, xml, ctype, json, fileinfo, openssl
                  coverage: none
                  tools: composer:v2

            - name: Copy env file
              run: cp .env.example .env

            - name: Configure test environment
              run: |
                  cat >> .env <<'EOF'
                  APP_ENV=testing
                  DB_CONNECTION=mysql
                  DB_HOST=mysql
                  DB_PORT=3306
                  DB_DATABASE=laravel
                  DB_USERNAME=sail
                  DB_PASSWORD=password
                  EOF

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Start Sail services
              run: ./vendor/bin/sail up -d --build --wait

            - name: Prepare application
              run: |
                  ./vendor/bin/sail artisan key:generate --force
                  ./vendor/bin/sail artisan migrate --force

            - name: Run tests
              run: ./vendor/bin/sail artisan test --compact

            - name: Stop Sail services
              if: always()
              run: ./vendor/bin/sail down -v

    deploy:
        name: Deploy to cPanel Dev Server
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/github_actions_secret
                  chmod 600 ~/.ssh/github_actions_secret
                  ssh-keyscan -p "${{ secrets.CPANEL_PORT }}" -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

            - name: Upload code to cPanel server
              run: |
                  rsync -az --delete \
                    -e "ssh -i ~/.ssh/github_actions_secret -p ${{ secrets.CPANEL_PORT }} -o IdentitiesOnly=yes" \
                    --exclude=".git" \
                    --exclude=".github" \
                    --exclude="node_modules" \
                    --exclude="vendor" \
                    --exclude=".env" \
                    --exclude="storage/logs/*" \
                    --exclude="storage/framework/cache/*" \
                    --exclude="storage/framework/sessions/*" \
                    --exclude="storage/framework/views/*" \
                    --exclude="storage/app/public/*" \
                    ./ \
                    "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.APP_PATH }}/"

            - name: Run Laravel deploy commands
              run: |
                  ssh -i ~/.ssh/github_actions_secret \
                    -p "${{ secrets.CPANEL_PORT }}" \
                    -o IdentitiesOnly=yes \
                    "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" << 'EOF'
                    set -e

                    cd "${{ secrets.APP_PATH }}"

                    echo "Installing dependencies..."
                    composer install --no-interaction --prefer-dist --optimize-autoloader

                    echo "Running migrations..."
                    php artisan migrate --force

                    php artisan storage:link || true
                    php artisan optimize:clear

                    echo "Deployment completed"
                  EOF
